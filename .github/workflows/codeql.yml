name: CodeQL

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '17 3 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze Android (Java/Kotlin)
    # Keep the Android/CodeQL toolchain on its last passing runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile app debug variant
        # Release compiler JVMs before starting the separate CodeQL analysis heap.
        run: ./gradlew :app:compileGplayDebugKotlin --stacktrace --no-configuration-cache --no-build-cache --no-daemon -Pkotlin.compiler.execution.strategy=in-process
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          ram: 7000
          threads: 2