name: pr-check
on: pull_request
permissions:
  contents: read
# fast-gate: brand guard + XML sanity (target < 5 min).
# gradle-setup / gradle-lint / gradle-test: Android SDK setup, lint, unit tests inside the 10 GB runner container.
# Gradle home and Android SDK live in named docker volumes so only the first
# run pays the slow dependency download (dev VM external network is slow).
jobs:
  pr-check:
    runs-on: dev-vm
    container: node:24-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Brand guard
        run: bash scripts/brand-guard.sh
      - name: Resource XML / properties sanity
        run: |
          python3 - <<'PY'
          import glob, sys
          import xml.etree.ElementTree as ET
          bad = 0
          files = [f for f in glob.glob('**/src/*/res/**/*.xml', recursive=True)] + glob.glob('**/AndroidManifest.xml', recursive=True)
          for f in files:
              try: ET.parse(f)
              except Exception as e: print('XML FAIL', f, e); bad += 1
          print('checked', len(files), 'xml files,', bad, 'bad')
          sys.exit(1 if bad else 0)
          PY

  gradle-setup:
    runs-on: dev-vm
    container:
      image: eclipse-temurin:21-jdk
      options: --memory=10g -v s2-android-gradle-home:/root/.gradle -v s2-android-sdk:/opt/android-sdk
    timeout-minutes: 30
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_ARGS: --no-daemon --max-workers=2 --stacktrace --console=plain -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.daemon.jvmargs=-Xmx2g
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git nodejs unzip curl ca-certificates
      - uses: actions/checkout@v4
      - name: Android SDK command-line tools (cached in volume)
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install SDK platform and build-tools (from Versions.kt)
        continue-on-error: false
        run: |
          V=plugins/src/main/kotlin/Versions.kt
          COMPILE=$(grep -E "const val COMPILE_SDK" $V | grep -oE "[0-9]+" | head -1)
          BT=$(grep -E "BUILD_TOOLS_VERSION =" $V | grep -oE "[0-9]+(\.[0-9]+)+" | head -1)
          echo "compileSdk=$COMPILE buildTools=$BT"
          test -n "$COMPILE" && test -n "$BT"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$COMPILE" "build-tools;$BT" "platform-tools"
      - name: Gradle and JDK versions
        run: |
          java -version
          ./gradlew --version --no-daemon --console=plain
      - name: Diagnostics on failure
        if: failure()
        run: |
          free -m
          echo "::error::gradle-setup failed"
          for f in $(find . -path "*/build/reports/*" \( -name "*.txt" -o -name "*.xml" \) -not -path "*/node_modules/*" 2>/dev/null | head -20); do
            echo "=== $f"; tail -n 60 "$f"
          done


  gradle-lint:
    runs-on: dev-vm
    container:
      image: eclipse-temurin:21-jdk
      options: --memory=10g -v s2-android-gradle-home:/root/.gradle -v s2-android-sdk:/opt/android-sdk
    timeout-minutes: 45
    needs: [gradle-setup]
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_ARGS: --no-daemon --max-workers=2 --stacktrace --console=plain -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.daemon.jvmargs=-Xmx2g
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git nodejs unzip curl ca-certificates
      - uses: actions/checkout@v4
      - name: Android lint
        run: ./gradlew :app:lintGplayDebug $GRADLE_ARGS
      - name: Diagnostics on failure
        if: failure()
        run: |
          free -m
          echo "::error::gradle-lint failed"
          for f in $(find . -path "*/build/reports/*" \( -name "*.txt" -o -name "*.xml" \) -not -path "*/node_modules/*" 2>/dev/null | head -20); do
            echo "=== $f"; tail -n 60 "$f"
          done


  gradle-test:
    runs-on: dev-vm
    container:
      image: eclipse-temurin:21-jdk
      options: --memory=10g -v s2-android-gradle-home:/root/.gradle -v s2-android-sdk:/opt/android-sdk
    timeout-minutes: 60
    needs: [gradle-setup]
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_ARGS: --no-daemon --max-workers=2 --stacktrace --console=plain -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.daemon.jvmargs=-Xmx2g
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git nodejs unzip curl ca-certificates
      - uses: actions/checkout@v4
      - name: Unit tests
        run: ./gradlew :app:testGplayDebugUnitTest testDebugUnitTest -x :tests:konsist:testDebugUnitTest $GRADLE_ARGS
      - name: Diagnostics on failure
        if: failure()
        run: |
          free -m
          echo "::error::gradle-test failed"
          for f in $(find . -path "*/build/reports/*" \( -name "*.txt" -o -name "*.xml" \) -not -path "*/node_modules/*" 2>/dev/null | head -20); do
            echo "=== $f"; tail -n 60 "$f"
          done
